services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-expedientes}
      POSTGRES_USER: ${DB_USERNAME:-expedientes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5451:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./api-expedientesjudiciales
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Expedientes Judiciales
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: https://sgej.regionhuanuco.gob.pe
      APP_LOCALE: es
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-expedientes}
      DB_USERNAME: ${DB_USERNAME:-expedientes}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
    volumes:
      - storage:/var/www/html/storage

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8001:80"
    volumes:
      - ./api-expedientesjudiciales/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./vue-procuraduria
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "8084:80"

volumes:
  pgdata:
  storage:
